version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: metar_user
      POSTGRES_PASSWORD: metar_pass
      POSTGRES_DB: metar_db
    ports:
      - "5666:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metar_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
